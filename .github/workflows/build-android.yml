name: Build TurboLite Android Beta

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build-android.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK to TurboLite-Beta.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TurboLite-Beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurboLite-Beta-APK
          path: app/build/outputs/apk/debug/TurboLite-Beta.apk
          if-no-files-found: error
          retention-days: 14
